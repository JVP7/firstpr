# Re-syncs every seed repo from GitHub once a day: new issues, issues closed or assigned since the
# last run, comments and pull requests, then refreshes repo_responsiveness. 1,200 repos take about
# 3.5 hours with waits for the hourly API limit, so the timeout is GitHub's 6-hour maximum; a run cut
# off anyway resumes the next day, because seed_load syncs the least recently synced repos first.
name: Refresh data

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-data

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sync seed repos
        run: python -m ingest.seed_load
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Secrets can't start with GITHUB_, so the ingest token is stored under another name.
          GITHUB_TOKEN: ${{ secrets.INGEST_GITHUB_TOKEN }}
